name: Notebook check

# Databricks notebooks cannot run on GitHub Actions (they need Spark + Unity
# Catalog). This job only verifies they are valid, non-empty .ipynb files.

on:
  push:
    paths:
      - "ingestion/**"
      - "model-eval/**"
      - "insights/**"
      - ".github/workflows/notebooks.yml"
      - ".github/scripts/check_notebooks.py"
  pull_request:
    paths:
      - "ingestion/**"
      - "model-eval/**"
      - "insights/**"
      - ".github/workflows/notebooks.yml"
      - ".github/scripts/check_notebooks.py"

permissions:
  contents: read

jobs:
  validate:
    name: Validate notebook JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check notebooks
        run: python .github/scripts/check_notebooks.py
